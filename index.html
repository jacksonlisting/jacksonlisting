<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackson Property | Hartanah Eksklusif Sabah</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.header{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand-container{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff}
.brand b{font-size:18px;display:block;letter-spacing:0.5px}
.brand small{display:block;color:#ccc;font-size:11px;margin-top:2px}
button,.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.admin-btn{background:#fff;color:#111;padding:10px 14px;font-size:13px;text-decoration:none}.container{max-width:900px;margin:auto;padding:16px}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.filter-btn{background:#e0e0e0;color:#333;padding:8px 10px;border-radius:8px;font-size:12px;border:none;cursor:pointer;font-weight:bold;flex:1 1 auto;text-align:center;white-space:nowrap}
.filter-btn.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #00000012}
.card img{width:100%;height:210px;object-fit:cover;background:#ddd}.content{padding:15px}
.price{font-size:21px;font-weight:bold;margin:8px 0;color:#18733a}
.meta{color:#666;margin:6px 0}
.status{font-size:12px;font-weight:bold;padding:6px 9px;border-radius:20px;background:#e8f7ec;color:#18733a;display:inline-block}
.status.Booked{background:#fff3cd;color:#856404}
.status.Sold{background:#f8d7da;color:#721c24}
.actions{display:flex;gap:8px;margin-top:14px}.view{background:#eee;color:#222;flex:1;text-align:center}.wa{background:#25D366;color:white;flex:1;text-align:center}
.empty{text-align:center;color:#777;padding:40px;grid-column:1/-1}
@media(max-width:500px){.header{align-items:center}.brand b{font-size:15px}.brand-logo{width:36px;height:36px}.card img{height:200px}}
</style>
</head>
<body>
<header><div class="header">
<div class="brand-container">
  <img src="logo.jpg" alt="Maxxan Realty Logo" class="brand-logo">
  <div class="brand">
    <b>JACKSON PROPERTY</b>
    <small>Maxxan Realty 🏠</small>
  </div>
</div>
<!-- Pautan terus ke panel admin selamat Netlify CMS -->
<a href="/admin/" class="admin-btn">Admin Login</a>
</div></header>

<main class="container">
<h2>Senarai Hartanah Terkini</h2>
<div class="filter-bar">
  <button class="filter-btn active" onclick="setZone('All', this)">Semua</button>
  <button class="filter-btn" onclick="setZone('Sandakan', this)">Sandakan</button>
  <button class="filter-btn" onclick="setZone('Kota Kinabalu', this)">KK</button>
  <button class="filter-btn" onclick="setZone('Tawau', this)">Tawau</button>
</div>
<div id="list" class="grid"></div>
</main>

<script>
const WA='60138885020';
let properties=[];
let currentZone='All';

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function setZone(zone, btn) {
  currentZone = zone;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function loadProperties() {
  try {
    const res = await fetch('data/properties.json');
    if(res.ok) {
      properties = await res.json();
    }
  } catch(e) {
    console.log('Belum ada fail data JSON atau ralat memuat turun.');
  }
  render();
}

function render(){
 const list=document.getElementById('list');
 const filtered = currentZone === 'All' 
   ? properties 
   : properties.filter(p => (p.location||'').toLowerCase() === (currentZone === 'Kota Kinabalu' ? 'kota kinabalu' : currentZone.toLowerCase()));

 if(!properties.length){
   list.innerHTML='<div class="empty">Belum ada property listing atau fail data sedang dimuatkan.</div>';
 } else if(!filtered.length){
   list.innerHTML=`<div class="empty">Tiada hartanah di zon ini buat masa ini.</div>`;
 } else {
   list.innerHTML=filtered.map(p=>{
     const msg=encodeURIComponent(`Hi Jackson, saya berminat dengan property ${p.name}. Boleh bagi maklumat lanjut?`);
     return `<article class="card"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div class="content">
     <span class="status ${esc(p.status)}">${esc(p.status)}</span><h3>${esc(p.name)}</h3><div class="price">RM${esc(p.price)}</div>
     <div class="meta">📍 ${esc(p.location)}</div><p>${esc(p.desc)}</p>
     <div class="actions"><a class="btn view" href="#top">VIEW DETAILS</a><a class="btn wa" target="_blank" href="https://wa.me/${WA}?text=${msg}">💬 WHATSAPP</a></div>
     </div></article>`;
   }).join('');
 }
}

loadProperties();
</script>
</body>
</html>
